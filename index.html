<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c2b4a">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SP Observe">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Stoney Point Classroom Observations</title>
<style>
:root{--navy:#1c2b4a;--navy2:#2c4170;--paper:#f7f1e3;--card:#fffdf7;--line:#d9cfb6;--ink:#1d2433;--mute:#6b6a63;--gold:#b8891a;--ok:#2f7d4f;--warn:#b8650a;--bad:#a8322d;--chip:#e7edf8}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:84px}
h1,h2,h3{margin:0;font-family:Georgia,"Times New Roman",serif;color:var(--navy)}
h2{font-size:1.25rem;margin:18px 0 8px}h3{font-size:1.05rem}
a{color:var(--navy2)}
button,input,select,textarea{font:inherit;color:inherit}
.logo{display:block;margin:0 auto 4px;height:72px;width:auto}
#hdr{text-align:center;padding:8px 14px 6px;background:var(--paper);border-bottom:1px solid var(--line)}
#hdr h1{font-size:1.2rem;margin:0;line-height:1.2}
#hdr .ver{font-size:.7rem;color:var(--mute);letter-spacing:.2px}
#hdr .who{font-size:.75rem;color:var(--mute);min-height:1em}
nav.tabs{background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;position:sticky;top:0;z-index:19}
nav.tabs a{flex:1 0 auto;padding:12px 14px;text-align:center;text-decoration:none;color:var(--navy);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;min-height:48px}
nav.tabs a.on{border-bottom-color:var(--gold);background:#faf5e6}
main{max-width:980px;margin:0 auto;padding:10px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.card.warn{border-left:5px solid var(--warn)}.card.bad{border-left:5px solid var(--bad)}.card.good{border-left:5px solid var(--ok)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
label.f{display:block;font-size:.8rem;font-weight:600;color:var(--mute);margin:0 0 3px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=password],input[type=search],select,textarea{width:100%;min-height:46px;padding:9px 11px;border:1px solid #bdb394;border-radius:9px;background:#fff}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #8fb0ee;outline-offset:1px}
.btn{min-height:48px;padding:10px 16px;border-radius:10px;border:1px solid var(--navy);background:var(--navy);color:#fff;font-weight:700;cursor:pointer}
.btn.alt{background:#fff;color:var(--navy)}.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}.btn.bad{background:var(--bad);border-color:var(--bad)}.btn.small{min-height:38px;padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.5}
a.btn{text-decoration:none}
@media screen{.sheet{zoom:var(--pz,1)}}
.big{width:100%;min-height:62px;font-size:1.1rem}
.muted{color:var(--mute)}.small{font-size:.85rem}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:700;background:#e9e4d3;color:#444}
.pill.ok{background:#d9efe1;color:#1d5a37}.pill.warn{background:#fbe6c6;color:#7a4204}.pill.bad{background:#f6d4d1;color:#7d1f1b}.pill.info{background:var(--chip);color:#233b6e}
.stat{text-align:center}.stat b{font:700 2rem Georgia,serif;color:var(--navy);display:block}
.list>.item{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid #eadfc3;min-height:52px}
.list>.item:last-child{border-bottom:0}.item .grow{flex:1;min-width:0}.item .t{font-weight:600}
.item.click{cursor:pointer}
.seg{display:flex;gap:0;border:1px solid var(--navy);border-radius:10px;overflow:hidden}
.seg button{flex:1;min-height:48px;border:0;background:#fff;color:var(--navy);font-weight:700;border-right:1px solid var(--navy);cursor:pointer;padding:6px}
.seg button:last-child{border-right:0}.seg button.on{background:var(--navy);color:#fff}
.opts{display:flex;gap:8px;flex-wrap:wrap}.opts button{min-height:48px;min-width:72px;border-radius:10px;border:2px solid var(--navy);background:#fff;color:var(--navy);font-weight:700;cursor:pointer;padding:6px 14px}
.opts button.on{background:var(--navy);color:#fff}
details.sec,details.cardx{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
details.sec>summary,details.cardx>summary{list-style:none;cursor:pointer;padding:14px;min-height:56px;display:flex;align-items:center;gap:10px;font:700 1.05rem Georgia,serif;color:var(--navy);background:#f4ecd5}
details.sec>summary::-webkit-details-marker,details.cardx>summary::-webkit-details-marker{display:none}
details.sec>summary:after,details.cardx>summary:after{content:"▾";margin-left:auto;font-size:1.1rem}
details.sec[open]>summary:after,details.cardx[open]>summary:after{content:"▴"}
details.sec .body,details.cardx .body{padding:6px 12px 14px}
.sec .num{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;align-items:center;justify-content:center;font:700 .9rem sans-serif}
.sub{font-weight:700;color:var(--navy2);margin:12px 0 4px;font-size:.92rem;text-transform:none}
.chk{display:flex;gap:12px;align-items:flex-start;padding:11px 8px;border-radius:10px;border:1px solid #e6dcc0;margin:6px 0;background:#fff;cursor:pointer;min-height:54px;user-select:none}
.chk .box{flex:0 0 28px;height:28px;border:2px solid var(--navy);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;margin-top:1px}
.chk.on{background:#e8f1e6;border-color:#8fbf9d}.chk.on .box{background:var(--ok);border-color:var(--ok)}
.chk .tx{flex:1}.chk .when{font-size:.75rem;color:var(--ok);font-weight:700;margin-left:6px}
.code{display:inline-block;font:700 .75rem ui-monospace,Menlo,monospace;background:var(--chip);color:#233b6e;border-radius:6px;padding:1px 6px;margin-left:4px;cursor:default}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tag{background:var(--chip);color:#233b6e;border-radius:99px;padding:5px 6px 5px 11px;font-weight:700;font-size:.82rem;display:inline-flex;gap:6px;align-items:center}
.tag button{border:0;background:#c9d6ee;border-radius:50%;width:24px;height:24px;cursor:pointer;font-weight:900;color:#233b6e}
.notelbl{font-size:.8rem;font-weight:700;color:var(--mute);margin-top:8px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--navy);padding:8px 12px;display:flex;gap:8px;align-items:center;z-index:30;box-shadow:0 -4px 12px rgba(0,0,0,.08)}
.bar .st{flex:1;font-size:.82rem;min-width:0}.bar .st b{display:block;font-size:1rem;color:var(--navy);font-variant-numeric:tabular-nums}
.bar .btn{flex:0 0 auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--navy);color:#fff;padding:11px 18px;border-radius:99px;z-index:60;max-width:92%;text-align:center;font-weight:600}
.toast.bad{background:var(--bad)}
.ovl{position:fixed;inset:0;background:rgba(15,20,35,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheetm{background:var(--paper);border-radius:16px 16px 0 0;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:14px}
@media(min-width:700px){.ovl{align-items:center}.sheetm{border-radius:16px}}
.sheetm .hd{display:flex;align-items:center;gap:10px;margin-bottom:8px;position:sticky;top:-14px;background:var(--paper);padding:6px 0;z-index:2}
.sheetm .hd h3{flex:1}
.pick{display:flex;gap:10px;padding:10px 6px;border-bottom:1px solid #e5dabb;cursor:pointer;align-items:flex-start;min-height:48px}
.pick.on{background:#e8f1e6}.pick .cd{flex:0 0 46px;font:700 .85rem ui-monospace,monospace;color:#233b6e}
.pick .star{color:var(--gold)}
.login{max-width:420px;margin:18px auto;padding:0 14px}
.barc{height:12px;border-radius:6px;background:#e5dcc2;overflow:hidden;min-width:60px}.barc i{display:block;height:100%;background:var(--navy2)}
table.rep{width:100%;border-collapse:collapse;font-size:.9rem}table.rep td,table.rep th{padding:7px 6px;border-bottom:1px solid #e9dfc3;text-align:left;vertical-align:middle}table.rep th{font-size:.75rem;color:var(--mute)}
.tscript{font:14px/1.5 ui-monospace,Menlo,monospace;min-height:220px}
.live{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:6px;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
.hide{display:none!important}
/* ---------- printable CDI form ---------- */
.printwrap{background:#fff;border:1px solid var(--line);padding:0;margin:10px 0;overflow:auto}
.sheet{width:7.7in;margin:0 auto;padding:.1in 0;background:#fff;color:#000;font:8.5pt/1.22 Arial,Helvetica,sans-serif;transform-origin:top left}
.sheet h1{font:700 12pt Georgia,serif;margin:0 0 1px;color:#000}
.sheet .phead{display:flex;align-items:center;gap:8px;margin-bottom:3px}.sheet .plogo{height:46px;width:auto;display:block}
.sheet .sub2{font-size:8pt;margin-bottom:3px;color:#333}
.sheet table{width:100%;border-collapse:collapse;margin:0 0 3px;table-layout:fixed}
.sheet td,.sheet th{border:1px solid #000;padding:1.5px 4px;vertical-align:top;text-align:left;word-wrap:break-word;overflow-wrap:anywhere}
.sheet th{background:#d9dfec;font-weight:700}
.sheet .l{width:56%}.sheet .r{width:44%}
.sheet .mv{font-weight:700;font-size:7.6pt;margin-top:1px}
.sheet .it{display:flex;gap:3px}.sheet .it .cb{flex:0 0 9px}.sheet .it.on{font-weight:700}
.sheet .cd{font-size:7pt;color:#333;white-space:nowrap}
.sheet .nt{white-space:pre-wrap}
.sheet .tg{font-size:7pt;color:#234}
.sheet .foot{font-size:7pt;color:#444;margin-top:2px}
@media print{
 @page{size:letter;margin:.35in}
 body{background:#fff;padding:0}
 #hdr,nav.tabs,.bar,.noprint,.toast,.ovl{display:none!important}
 main{max-width:none;padding:0}
 .printwrap{border:0;margin:0;overflow:visible}
 .sheet{margin:0}
 .pb{page-break-after:always}
}
#chips button{min-height:44px;min-width:0;padding:4px 11px;font-size:.88rem;border-width:1.5px}

@media print{body.igprint *{visibility:hidden}body.igprint #igbox,body.igprint #igbox *{visibility:visible}body.igprint #igbox{position:absolute;left:0;top:0;width:100%;border:0;padding:0}}

details.movedef{margin:0 0 10px;border:1px solid var(--line);border-radius:10px;background:#faf5e6;padding:2px 12px}details.movedef summary{cursor:pointer;font-weight:700;color:var(--navy);min-height:40px;display:flex;align-items:center}.code[data-tlf]{cursor:pointer;text-decoration:underline dotted}

body.viewer #tabs a[data-t="new"],body.viewer #tabs a[data-t="settings"],body.viewer a[href^="#/new"],body.viewer #addT,body.viewer #mergebox,body.viewer #tmerge,body.viewer #tdel,body.viewer #tsave,body.viewer #thide,body.viewer #vme,body.viewer [data-email],body.viewer [data-del],body.viewer [data-restore],body.viewer #vdel,body.viewer label:has(#vdel),body.viewer #pemail,body.viewer [data-discard]{display:none!important}
body.viewer #edtog,body.viewer [data-fudone],body.viewer #tr,body.viewer #tg,body.viewer #te{pointer-events:none}

body.gmode #out{display:none!important}

</style>
</head>
