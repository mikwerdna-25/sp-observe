<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c2b4a">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Stoney Point Classroom Observations</title>
<style>
:root{--navy:#1c2b4a;--navy2:#2c4170;--paper:#f7f1e3;--card:#fffdf7;--line:#d9cfb6;--ink:#1d2433;--mute:#6b6a63;--gold:#b8891a;--ok:#2f7d4f;--warn:#b8650a;--bad:#a8322d;--chip:#e7edf8}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:84px}
h1,h2,h3{margin:0;font-family:Georgia,"Times New Roman",serif;color:var(--navy)}
h2{font-size:1.25rem;margin:18px 0 8px}h3{font-size:1.05rem}
a{color:var(--navy2)}
button,input,select,textarea{font:inherit;color:inherit}
.logo{display:block;margin:0 auto 4px;height:72px;width:auto}
#hdr{text-align:center;padding:8px 14px 6px;background:var(--paper);border-bottom:1px solid var(--line)}
#hdr h1{font-size:1.2rem;margin:0;line-height:1.2}
#hdr .ver{font-size:.7rem;color:var(--mute);letter-spacing:.2px}
#hdr .who{font-size:.75rem;color:var(--mute);min-height:1em}
nav.tabs{background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;position:sticky;top:0;z-index:19}
nav.tabs a{flex:1 0 auto;padding:12px 14px;text-align:center;text-decoration:none;color:var(--navy);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;min-height:48px}
nav.tabs a.on{border-bottom-color:var(--gold);background:#faf5e6}
main{max-width:980px;margin:0 auto;padding:10px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.card.warn{border-left:5px solid var(--warn)}.card.bad{border-left:5px solid var(--bad)}.card.good{border-left:5px solid var(--ok)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
label.f{display:block;font-size:.8rem;font-weight:600;color:var(--mute);margin:0 0 3px}
input[type=text],input[type=date],input[type=time],input[type=email],input[type=password],input[type=search],select,textarea{width:100%;min-height:46px;padding:9px 11px;border:1px solid #bdb394;border-radius:9px;background:#fff}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #8fb0ee;outline-offset:1px}
.btn{min-height:48px;padding:10px 16px;border-radius:10px;border:1px solid var(--navy);background:var(--navy);color:#fff;font-weight:700;cursor:pointer}
.btn.alt{background:#fff;color:var(--navy)}.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}.btn.bad{background:var(--bad);border-color:var(--bad)}.btn.small{min-height:38px;padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.5}
a.btn{text-decoration:none}
@media screen{.sheet{zoom:var(--pz,1)}}
.big{width:100%;min-height:62px;font-size:1.1rem}
.muted{color:var(--mute)}.small{font-size:.85rem}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:700;background:#e9e4d3;color:#444}
.pill.ok{background:#d9efe1;color:#1d5a37}.pill.warn{background:#fbe6c6;color:#7a4204}.pill.bad{background:#f6d4d1;color:#7d1f1b}.pill.info{background:var(--chip);color:#233b6e}
.stat{text-align:center}.stat b{font:700 2rem Georgia,serif;color:var(--navy);display:block}
.list>.item{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid #eadfc3;min-height:52px}
.list>.item:last-child{border-bottom:0}.item .grow{flex:1;min-width:0}.item .t{font-weight:600}
.item.click{cursor:pointer}
.seg{display:flex;gap:0;border:1px solid var(--navy);border-radius:10px;overflow:hidden}
.seg button{flex:1;min-height:48px;border:0;background:#fff;color:var(--navy);font-weight:700;border-right:1px solid var(--navy);cursor:pointer;padding:6px}
.seg button:last-child{border-right:0}.seg button.on{background:var(--navy);color:#fff}
.opts{display:flex;gap:8px;flex-wrap:wrap}.opts button{min-height:48px;min-width:72px;border-radius:10px;border:2px solid var(--navy);background:#fff;color:var(--navy);font-weight:700;cursor:pointer;padding:6px 14px}
.opts button.on{background:var(--navy);color:#fff}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
details.sec>summary{list-style:none;cursor:pointer;padding:14px;min-height:56px;display:flex;align-items:center;gap:10px;font:700 1.05rem Georgia,serif;color:var(--navy);background:#f4ecd5}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary:after{content:"▾";margin-left:auto;font-size:1.1rem}
details.sec[open]>summary:after{content:"▴"}
details.sec .body{padding:6px 12px 14px}
.sec .num{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;align-items:center;justify-content:center;font:700 .9rem sans-serif}
.sub{font-weight:700;color:var(--navy2);margin:12px 0 4px;font-size:.92rem;text-transform:none}
.chk{display:flex;gap:12px;align-items:flex-start;padding:11px 8px;border-radius:10px;border:1px solid #e6dcc0;margin:6px 0;background:#fff;cursor:pointer;min-height:54px;user-select:none}
.chk .box{flex:0 0 28px;height:28px;border:2px solid var(--navy);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;margin-top:1px}
.chk.on{background:#e8f1e6;border-color:#8fbf9d}.chk.on .box{background:var(--ok);border-color:var(--ok)}
.chk .tx{flex:1}.chk .when{font-size:.75rem;color:var(--ok);font-weight:700;margin-left:6px}
.code{display:inline-block;font:700 .75rem ui-monospace,Menlo,monospace;background:var(--chip);color:#233b6e;border-radius:6px;padding:1px 6px;margin-left:4px;cursor:default}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tag{background:var(--chip);color:#233b6e;border-radius:99px;padding:5px 6px 5px 11px;font-weight:700;font-size:.82rem;display:inline-flex;gap:6px;align-items:center}
.tag button{border:0;background:#c9d6ee;border-radius:50%;width:24px;height:24px;cursor:pointer;font-weight:900;color:#233b6e}
.notelbl{font-size:.8rem;font-weight:700;color:var(--mute);margin-top:8px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--navy);padding:8px 12px;display:flex;gap:8px;align-items:center;z-index:30;box-shadow:0 -4px 12px rgba(0,0,0,.08)}
.bar .st{flex:1;font-size:.82rem;min-width:0}.bar .st b{display:block;font-size:1rem;color:var(--navy);font-variant-numeric:tabular-nums}
.bar .btn{flex:0 0 auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--navy);color:#fff;padding:11px 18px;border-radius:99px;z-index:60;max-width:92%;text-align:center;font-weight:600}
.toast.bad{background:var(--bad)}
.ovl{position:fixed;inset:0;background:rgba(15,20,35,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheetm{background:var(--paper);border-radius:16px 16px 0 0;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:14px}
@media(min-width:700px){.ovl{align-items:center}.sheetm{border-radius:16px}}
.sheetm .hd{display:flex;align-items:center;gap:10px;margin-bottom:8px;position:sticky;top:-14px;background:var(--paper);padding:6px 0;z-index:2}
.sheetm .hd h3{flex:1}
.pick{display:flex;gap:10px;padding:10px 6px;border-bottom:1px solid #e5dabb;cursor:pointer;align-items:flex-start;min-height:48px}
.pick.on{background:#e8f1e6}.pick .cd{flex:0 0 46px;font:700 .85rem ui-monospace,monospace;color:#233b6e}
.pick .star{color:var(--gold)}
.login{max-width:420px;margin:18px auto;padding:0 14px}
.barc{height:12px;border-radius:6px;background:#e5dcc2;overflow:hidden;min-width:60px}.barc i{display:block;height:100%;background:var(--navy2)}
table.rep{width:100%;border-collapse:collapse;font-size:.9rem}table.rep td,table.rep th{padding:7px 6px;border-bottom:1px solid #e9dfc3;text-align:left;vertical-align:middle}table.rep th{font-size:.75rem;color:var(--mute)}
.tscript{font:14px/1.5 ui-monospace,Menlo,monospace;min-height:220px}
.live{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:6px;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
.hide{display:none!important}
/* ---------- printable CDI form ---------- */
.printwrap{background:#fff;border:1px solid var(--line);padding:0;margin:10px 0;overflow:auto}
.sheet{width:7.7in;margin:0 auto;padding:.1in 0;background:#fff;color:#000;font:8.5pt/1.22 Arial,Helvetica,sans-serif;transform-origin:top left}
.sheet h1{font:700 12pt Georgia,serif;margin:0 0 1px;color:#000}
.sheet .phead{display:flex;align-items:center;gap:8px;margin-bottom:3px}.sheet .plogo{height:46px;width:auto;display:block}
.sheet .sub2{font-size:8pt;margin-bottom:3px;color:#333}
.sheet table{width:100%;border-collapse:collapse;margin:0 0 3px;table-layout:fixed}
.sheet td,.sheet th{border:1px solid #000;padding:1.5px 4px;vertical-align:top;text-align:left;word-wrap:break-word;overflow-wrap:anywhere}
.sheet th{background:#d9dfec;font-weight:700}
.sheet .l{width:56%}.sheet .r{width:44%}
.sheet .mv{font-weight:700;font-size:7.6pt;margin-top:1px}
.sheet .it{display:flex;gap:3px}.sheet .it .cb{flex:0 0 9px}.sheet .it.on{font-weight:700}
.sheet .cd{font-size:7pt;color:#333;white-space:nowrap}
.sheet .nt{white-space:pre-wrap}
.sheet .tg{font-size:7pt;color:#234}
.sheet .foot{font-size:7pt;color:#444;margin-top:2px}
@media print{
 @page{size:letter;margin:.35in}
 body{background:#fff;padding:0}
 #hdr,nav.tabs,.bar,.noprint,.toast,.ovl{display:none!important}
 main{max-width:none;padding:0}
 .printwrap{border:0;margin:0;overflow:visible}
 .sheet{margin:0}
 .pb{page-break-after:always}
}
#chips button{min-height:44px;min-width:0;padding:4px 11px;font-size:.88rem;border-width:1.5px}

</style>
</head>

const hm = d => pad2(d.getHours()) + ':' + pad2(d.getMinutes());
const hms = d => hm(d) + ':' + pad2(d.getSeconds());
const isoLocal = d => ymd(d) + 'T' + hms(d);
function fmtT(t) { const m = /^(\d{1,2}):(\d{2})/.exec(t || ''); if (!m) return t || ''; let h = +m[1]; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + m[2] + ' ' + ap; }
function fmtD(s) { if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return s || ''; const d = new Date(s + 'T12:00:00'); return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); }
function fmtDs(s) { if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return s || ''; const d = new Date(s + 'T12:00:00'); return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }); }
function rid(prefix) { const a = new Uint8Array(8); (self.crypto || window.crypto).getRandomValues(a); return prefix + Array.from(a, b => (b % 36).toString(36)).join(''); }
const todayStr = () => ymd(new Date());
function daysTxt(n) { return n === 0 ? 'today' : n === 1 ? '1 day' : n < 0 ? Math.abs(n) + ' days past' : n + ' days'; }
function hhmmToMin(t) { const m = /^(\d{1,2}):(\d{2})/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null; }
function minutesBetween(a, b) { const x = hhmmToMin(a), y = hhmmToMin(b); return x == null || y == null || y < x ? null : y - x; }

/* ---------- talking to the Apps Script (GET + JSON, long data sent in pieces) ---------- */
class AuthError extends Error { }
async function rawGet(params) {
  const base = apiBase();
  if (!base) throw new Error('The web app address has not been set yet.');
  const q = Object.keys(params).filter(k => params[k] !== undefined && params[k] !== null).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k])).join('&');
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 45000);
  try {
    const r = await fetch(base + (base.indexOf('?') >= 0 ? '&' : '?') + q, { method: 'GET', redirect: 'follow', signal: ctl.signal });
    if (!r.ok) throw new Error('Server answered ' + r.status);
    return await r.json();
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('The server took too long. Check your connection and try again.');
    if (e instanceof TypeError) throw new Error('Could not reach the server (offline?).');
    throw e;
  } finally { clearTimeout(to); }
}
function splitForUrl(json, maxEnc) {
  const out = []; let i = 0;
  while (i < json.length) {
    let n = Math.min(1500, json.length - i);
    for (; ;) {
      let piece = json.substr(i, n);
      if (n > 1 && /[\uD800-\uDBFF]/.test(piece.slice(-1))) { n--; continue; }
      if (encodeURIComponent(piece).length <= maxEnc || n <= 20) { out.push(piece); i += n; break; }
      n = Math.floor(n * 0.7);
    }
  }
  return out;
}
async function api(action, payload, extra, soft) {
  const params = Object.assign({ action, token: S.token || '' }, extra || {});
  if (payload !== undefined) {
    const json = JSON.stringify(payload);
    if (encodeURIComponent(json).length < 1800) params.p = json;
    else {
      const parts = splitForUrl(json, 2400), k = rid('u');
      const res = await Promise.all(parts.map((d, i) => rawGet({ action: 'put', token: S.token || '', k, i, n: parts.length, d })));
      for (const r of res) { if (r.auth) { authLost(); throw new AuthError('Please sign in again.'); } if (!r.ok) throw new Error(r.error || 'Upload failed'); }
      params.ref = k; params.n = parts.length;
    }
  }
  const res = await rawGet(params);
  if (res.auth) { authLost(); throw new AuthError(res.error); }
  if (!res.ok && !soft) { const e = new Error(res.error || 'Something went wrong.'); e.res = res; throw e; }
  return res;
}
function authLost() { S.token = null; saveSession(); showLogin('Your session ended. Please sign in again.'); }

/* ---------- toast + modal ---------- */
let toastT;
function toast(msg, bad) {
  $$('.toast').forEach(t => t.remove());
  const d = document.createElement('div'); d.className = 'toast' + (bad ? ' bad' : ''); d.textContent = msg; d.setAttribute('role', 'status');
  document.body.appendChild(d); clearTimeout(toastT); toastT = setTimeout(() => d.remove(), bad ? 6000 : 2600);
}
function modal(html, onClose) {
  closeModal();
  const o = document.createElement('div'); o.className = 'ovl'; o.id = 'modal';
  o.innerHTML = '<div class="sheetm" role="dialog" aria-modal="true">' + html + '</div>';
  o.addEventListener('click', e => { if (e.target === o) closeModal(); });
  document.body.appendChild(o); o._onClose = onClose; return o;
}
function closeModal() { const o = $('#modal'); if (o) { const f = o._onClose; o.remove(); if (f) f(); } }
function confirmBox(text, yes, danger) {      // its own layer, so it never closes the window underneath it
  return new Promise(res => {
    const o = document.createElement('div'); o.className = 'ovl'; o.id = 'cbox'; o.style.zIndex = 70;
    o.innerHTML = '<div class="sheetm" role="alertdialog" aria-modal="true"><h3>' + esc(text) + '</h3><div class="row" style="margin-top:14px"><button class="btn ' + (danger ? 'bad' : '') + '" data-y>' + esc(yes || 'Yes') + '</button><button class="btn alt" data-n>Cancel</button></div></div>';
    document.body.appendChild(o);
    const done = v => { o.remove(); res(v); };
    $('[data-y]', o).onclick = () => done(true); $('[data-n]', o).onclick = () => done(false);
    o.addEventListener('click', e => { if (e.target === o) done(false); });
  });
}

/* ---------- router ---------- */

window.addEventListener('hashchange', () => { if (S.init) route(); });
async function route() {
  if (!S.init) return;
  const h = (location.hash || '#/').slice(1), parts = h.split('?')[0].split('/').filter(Boolean);
  const q = new URLSearchParams(h.split('?')[1] || '');
  if (!(parts[0] === 'obs')) { stopClock(); stopAutosave(); stopSTT(); }
  if (parts[0] !== 'obs') clearBar();
  try {

      case 'done': setTab('visits'); return viewDone(decodeURIComponent(parts[1] || ''));
      case 'visits': setTab('visits'); return await viewVisits();
      case 'teachers': setTab('teachers'); return viewTeachers();

}

/* ---------- CSV ---------- */
function csvCell(v) {
  v = v == null ? '' : String(v);
  if (/^[=+\-@\t\r]/.test(v)) v = "'" + v;           // keep spreadsheet programs from running text as formulas
  return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function toCsv(rows, cols) { return [cols.join(',')].concat(rows.map(r => cols.map(c => csvCell(r[c])).join(','))).join('\r\n'); }
function download(name, text, type) {
  const b = new Blob([text], { type: type || 'text/csv;charset=utf-8' }), a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
async function exportCsv(from, to) {

/* ============ THE OBSERVATION FORM ============ */
let O = null;                      // observation being edited
let clockT = null, autoT = null, localT = null, saving = false;
const FW = () => { if (!S._fw) { S._fw = {}; (S.init.framework || []).forEach(f => S._fw[f.code] = f); } return S._fw; };
function fwName(c) { const f = FW()[c]; return f ? f.element : ''; }
function normCode(c) { return String(c || '').trim().toLowerCase().replace(/^([1-5][a-e])\.?([1-9])$/, '$1.$2'); }
function splitCodes(s) { return String(s || '').split(/[,&;\s]+/).map(normCode).filter(Boolean); }
function periodFor(t) {
  const m = hhmmToMin(t); if (m == null) return '';
  const b = (S.init.bell || []).find(x => { const a = hhmmToMin(x.start), z = hhmmToMin(x.end); return a != null && z != null && m >= a && m < z; });
  return b ? b.name : '';
}
function sections() {
  const map = {};
  (S.init.form || []).forEach(r => {
    const s = map[r.section] || (map[r.section] = { n: r.section, title: '', informal: 'Y', q: [], teacher: [], student: [] });
    if (r.type === 'section') { s.title = r.text; s.informal = r.informal === 'N' ? 'N' : 'Y'; }
    else if (r.type === 'question') s.q.push(r); else if (r.type === 'teacher') s.teacher.push(r); else if (r.type === 'student') s.student.push(r);
  });
  return Object.keys(map).map(Number).sort((a, b) => a - b).map(k => map[k]);
}
function blankData() { return { answers: {}, checks: {}, notes: {}, glows: '', feedback: '', pre_notes: '', post_notes: '', gen_notes: '', followups: [] }; }
function glowDraft(d) {      // plain bullets from the checked moves, for the observer to edit
  const out = [];
  Object.keys(d.checks || {}).map(k => d.checks[k]).sort((a, b) => (a.t < b.t ? -1 : 1)).forEach(c => out.push('- ' + (c.role === 'student' ? 'Students: ' : 'You: ') + c.text.replace(/\.$/, '')));
  return out.join('\n');
}
function addWeekdays(s, n) { const d = new Date(s + 'T12:00:00'); let left = n; while (left > 0) { d.setDate(d.getDate() + 1); const w = d.getDay(); if (w !== 0 && w !== 6) left--; } return ymd(d); }

async function newObs(type, teacher, gpv) {
  const now = new Date(), t = (S.init.teachers || []).find(x => x.name === teacher) || {};
  O = { id: rid('o_'), type, teacher, date: ymd(now), time_in: hm(now), time_out: '', period: periodFor(hm(now)), room: t.default_room || '', grades: t.grades || '', subject: '',
    is_gpv: !!gpv, status: 'draft', pre_date: '', post_date: '', ratings_shared: '', consent_transcript: false, data: blankData(), transcript: '', base_updated: '', _trSaved: '', _dirty: true, _started: now.getTime(), _new: true };
  saveLocal(); go('/obs/' + encodeURIComponent(O.id));
  if (!t.default_room) {          // fill the room from the last visit, if there was one

/* ---- DOK guide (Webb's Depth of Knowledge, summarized) ---- */
const DOK = {
  1: { name: 'Recall and reproduction', what: 'Students recall a fact, term, rule or step, or follow a set procedure. There is one right answer and little or no decision-making.', see: 'Defining, listing, labeling, copying from notes, matching, fill-in-the-blank, one-step calculations, answering "what is...?"', ask: 'Could a student succeed just by remembering or following steps they were shown?' },
  2: { name: 'Skills and concepts', what: 'Students use information or a method and make some decisions about how: compare, classify, summarize, interpret, organize data, or solve a problem with several steps and a clear path.', see: 'Summarizing a passage, comparing two things, graphing or organizing data, explaining how or why in a familiar situation, a multi-step problem with a known method.', ask: 'Do students have to decide how to apply what they know, in more than one step?' },
  3: { name: 'Strategic thinking', what: 'Students reason, plan and justify. More than one approach or answer is possible, so they must support their thinking with evidence or logic.', see: 'Defending a claim with evidence from a text, analyzing an author\'s argument, designing an experiment, tackling a non-routine problem and explaining why the solution works.', ask: 'Do students have to build and defend their own reasoning, with no single obvious path?' },
  4: { name: 'Extended thinking', what: 'Students investigate a complex problem over an extended period, pulling together several sources or ideas, and design, create or apply them to a real situation, revising as they go.', see: 'A multi-day research project that synthesizes several sources, designing and carrying out an investigation, a community problem with a researched proposal.', ask: 'Is this a sustained investigation (days or weeks) where students synthesize and revise? In one visit you may only see one part, so note what you see and whether it belongs to a longer project.' }
};
function dokNum(choice) { const m = /DOK\s*(\d)/.exec(choice || ''); return m ? +m[1] : 0; }
function dokDescHtml(choice) { const n = dokNum(choice); return n ? `<b>${esc(choice)} - ${esc(DOK[n].name)}.</b> ${esc(DOK[n].what)}` : 'Tap a level to see what it means.'; }
function dokGuide() {
  const m = modal(`<div class="hd"><h3>DOK levels at a glance</h3><button class="btn small" data-x>Done</button></div>
    <p class="small muted" style="margin:0 0 6px">Depth of Knowledge (Norman Webb) describes how complex the thinking is that a <b>task</b> asks of students, not how hard it feels. Rate what students are actually doing, not the verb in the question: "describe" can be DOK 1 or DOK 2 depending on the task. Hard recall is still DOK 1.</p>
    ${[1, 2, 3, 4].map(n => `<div class="card" style="margin:8px 0"><h3>DOK ${n} - ${esc(DOK[n].name)}</h3><p style="margin:4px 0">${esc(DOK[n].what)}</p><div class="small"><b>You might see:</b> ${esc(DOK[n].see)}</div><div class="small" style="margin-top:4px"><b>Ask yourself:</b> ${esc(DOK[n].ask)}</div></div>`).join('')}
    <p class="small muted">Quick test when torn between two levels: is there one clear route to the answer (DOK 1-2) or more than one defensible approach that students must justify (DOK 3 and up)?</p>`);
  $('[data-x]', m).onclick = closeModal;
}

async function saveObs(opt) {
  opt = opt || {};
  if (!O || saving) return false;
  if (!O.teacher) { if (!opt.auto) toast('Choose a teacher first.', true); return false; }
  if (opt.finish) {
    if (!O.time_out) { O.time_out = hm(new Date()); const e = $('[data-f=time_out]'); if (e) e.value = O.time_out; }
    const mins = minutesBetween(O.time_in, O.time_out);
    if (O.is_gpv && mins != null && mins < 10 && !(await confirmBox('Only ' + mins + ' minute(s) between Time In and Time Out. A Growth Plan Visit is at least 10 minutes. Finish anyway?', 'Finish anyway'))) return false;
    O.status = 'final';
  }
  saving = true; if (!opt.auto) setSt('Saving...');
  try {
    const r = await api('obs_save', payload({ auto: !!opt.auto, force: !!O._force }), undefined, true);
    if (!r.ok) {
      if (r.conflict) { if (opt.finish) O.status = 'draft'; saving = false; conflictModal(r.error); return false; }
      throw new Error(r.error);
    }
    O._force = false; O.base_updated = r.updated_at; O._dirty = false; O._new = false;
    if ((O.transcript || '') !== (O._trSaved || '')) { await api('tr_save', { id: O.id, text: O.transcript || '' }); O._trSaved = O.transcript || ''; }
    if (r.warnings && r.warnings.length && !opt.auto) toast('Saved. Note: ' + r.warnings[0], true);
    if (O.status === 'final') lsDel('spobs_draft_' + O.id); else saveLocal();
    setSt(opt.auto ? 'Auto-saved ' + fmtT(hm(new Date())) : 'Saved ' + fmtT(hm(new Date())));
    saving = false;
    if (opt.finish) { const id = O.id; O = null; go('/done/' + encodeURIComponent(id)); }
    else if (!opt.auto && !opt.quiet) toast(O.status === 'final' ? 'Changes saved' : 'Draft saved');
    return true;
  } catch (e) {
    saving = false; if (opt.finish) O.status = 'draft';
    if (e instanceof AuthError) { saveLocal(); return false; }
    setSt('Not saved to server - kept on this device'); saveLocal();
    if (!opt.auto) toast(e.message, true);
    return false;
  }
}
function conflictModal(msg) {

/* ---- transcription ---- */
const STT = { rec: null, on: false };
function stopSTT() { STT.on = false; try { STT.rec && STT.rec.stop(); } catch (e) { } STT.rec = null; const b = $('#sttbtn'); if (b) b.textContent = 'Start listening'; }
function appendTranscript(text) {
  if (!text) return; const sp = $('#spk') ? $('#spk').value : '';
  O.transcript = (O.transcript || '') + (O.transcript && !/\n$/.test(O.transcript) ? '\n' : '') + '[' + hms(new Date()) + '] ' + (sp ? sp + ': ' : '') + text + '\n';
  const ta = $('#tscript'); if (ta) { ta.value = O.transcript; ta.scrollTop = ta.scrollHeight; } countTr(); touch();
}
function countTr() { const c = $('#trcount'); if (c) c.textContent = (O.transcript || '').split(/\s+/).filter(Boolean).length + ' words'; }
function bindTranscript() {
  const card = $('#trcard'); if (!card) return;
  countTr();
  $$('#trseg button').forEach(b => b.onclick = () => { $$('#trseg button').forEach(x => x.classList.toggle('on', x === b)); $$('[data-pane]', card).forEach(p => p.classList.toggle('hide', p.dataset.pane !== b.dataset.m)); });
  $('#tscript').oninput = e => { O.transcript = e.target.value; countTr(); touch(); };
  $('#trstamp').onclick = () => { const ta = $('#tscript'); O.transcript = (O.transcript || '') + (O.transcript && !/\n$/.test(O.transcript) ? '\n' : '') + '[' + hms(new Date()) + '] '; ta.value = O.transcript; ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); touch(); };
  $('#trdl').onclick = () => download('transcript-' + (O.teacher || 'obs').replace(/[^a-z0-9]+/gi, '-') + '-' + O.date + '.txt', O.transcript || '', 'text/plain;charset=utf-8');
  $('#trclr').onclick = async () => { if (O.transcript && await confirmBox('Clear the whole transcript on this screen?', 'Clear', true)) { O.transcript = ''; $('#tscript').value = ''; countTr(); touch(); } };
  $('#trfile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return; let txt = await f.text();
    if (/\.(vtt|srt)$/i.test(f.name)) txt = txt.replace(/^WEBVTT.*$/m, '').replace(/^\d+\s*$/gm, '').replace(/(\d\d:\d\d:\d\d)[.,]\d+ --> .*$/gm, '[$1]').replace(/(\[\d\d:\d\d:\d\d\])\n/g, '$1 ').replace(/\n{3,}/g, '\n\n').trim() + '\n';
    O.transcript = (O.transcript ? O.transcript + '\n' : '') + txt; $('#tscript').value = O.transcript; countTr(); touch(); toast('Loaded ' + f.name);
  };
  const btn = $('#sttbtn'); if (!btn) return;
  btn.onclick = () => {
    if (STT.on) { stopSTT(); return; }
    if (!O.consent_transcript) return toast('Check the consent box first.', true);
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition; const rec = new SR();
    rec.lang = 'en-US'; rec.continuous = true; rec.interimResults = true; STT.rec = rec; STT.on = true; btn.textContent = 'Stop listening';
    rec.onresult = ev => { let interim = ''; for (let i = ev.resultIndex; i < ev.results.length; i++) { const r = ev.results[i]; if (r.isFinal) appendTranscript(r[0].transcript.trim()); else interim += r[0].transcript; } const it = $('#interim'); if (it) it.innerHTML = interim ? '<span class="live"></span>' + esc(interim) : '<span class="live"></span>Listening...'; };
    rec.onerror = ev => { if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') { toast('Microphone permission was blocked.', true); stopSTT(); } else if (ev.error !== 'no-speech' && ev.error !== 'aborted') toast('Speech error: ' + ev.error, true); };
    rec.onend = () => { if (STT.on) { try { rec.start(); } catch (e) { setTimeout(() => { try { STT.on && rec.start(); } catch (x) { } }, 400); } } else { const it = $('#interim'); if (it) it.textContent = ''; } };
    try { rec.start(); const it = $('#interim'); if (it) it.innerHTML = '<span class="live"></span>Listening...'; } catch (e) { toast(e.message, true); stopSTT(); }
  };
}

  const opt = S.pf || (S.pf = { transcript: false, prepost: true });
  const draw = () => {
    view(`<div class="noprint"><div class="row"><a class="btn small alt" href="#/visits">‹ Visits</a><h2 style="flex:1;margin:0">Print</h2><button class="btn" id="pgo">Print / Save as PDF</button></div>
      <div class="card"><div class="row"><label class="row small" style="gap:6px"><input type="checkbox" id="po1" ${opt.prepost ? 'checked' : ''} style="width:22px;height:22px"> Include pre/post conference notes</label>
      ${r.transcript ? `<label class="row small" style="gap:6px"><input type="checkbox" id="po2" ${opt.transcript ? 'checked' : ''} style="width:22px;height:22px"> Add transcript on extra page(s)</label>` : ''}
      <button class="btn small alt" id="pemail">Email feedback...</button></div>
      <p class="small muted" style="margin:6px 0 0">The form fits on one page. If your notes are very long it flows onto a second page. In the print window choose "Save as PDF" to keep a copy.</p></div></div>
      <div class="printwrap">${sheetHtml(r, opt)}</div>`);
    $('#pgo').onclick = () => window.print(); $('#pemail').onclick = () => emailModal(id);
    $('#po1').onchange = e => { opt.prepost = e.target.checked; draw(); }; if ($('#po2')) $('#po2').onchange = e => { opt.transcript = e.target.checked; draw(); };
    fitSheet(); const pw = $('.printwrap'); if (pw) document.documentElement.style.setProperty('--pz', Math.min(1, (pw.clientWidth - 4) / (7.7 * 96)).toFixed(3));
  };
  draw();
}
function fitSheet() {
  const sh = $('.sheet'); if (!sh) return;
  requestAnimationFrame(() => {
    const first = $('.sheet .pagefit'); if (!first) return;
    first.style.zoom = 1; const H = first.scrollHeight, MAX = 10.25 * 96;
    if (H > MAX) first.style.zoom = Math.max(0.58, MAX / H);
  });
}
function sheetHtml(r, opt) {
  const o = r.obs, d = r.data || {}, checks = d.checks || {}, notes = d.notes || {}, answers = d.answers || {};
  const secs = sections(), E = esc;
  const noteTxt = key => { const n = notes[key]; if (!n) return ''; const tags = (n.tags || []).length ? `<div class="tg">TLF: ${E(n.tags.join(', '))}</div>` : ''; return (n.text ? `<div class="nt">${E(n.text)}</div>` : '') + tags; };
  const item = (it, role, sec) => { const c = checks[it.id]; return `<div class="it ${c ? 'on' : ''}"><span class="cb">${c ? '☑' : '☐'}</span><span>${E(it.text)} <span class="cd">(${E(splitCodes(it.codes).join(' & '))})</span>${c ? ` <span class="cd">${E(fmtT(c.t.slice(11, 16)))}</span>` : ''}</span></div>`; };
  const orphan = (sec, role, known) => Object.keys(checks).filter(id => String(checks[id].section) === String(sec) && checks[id].role === role && known.indexOf(id) < 0).map(id => item({ id, text: checks[id].text, codes: checks[id].codes }, role, sec)).join('');
  const lg = document.querySelector('img.logo'), logo = lg ? `<img class="plogo" alt="" src="${lg.src}">` : '';
  let h = `<div class="sheet"><div class="pagefit">
  <div class="phead">${logo}<div><h1>Classroom Observation</h1><div class="sub2">${E((S.init.settings || {}).school_name || '')} &middot; ${o.type === 'formal' ? 'Formal observation' : 'Informal walkthrough'}${o.is_gpv ? ' (Growth Plan Visit)' : ''}${o.period ? ' &middot; ' + E(o.period) : ''}${o.room ? ' &middot; ' + E(o.room) : ''}</div></div></div>
  <table><tr><th style="width:12%">Teacher:</th><td style="width:38%">${E(o.teacher)}</td><th style="width:12%">Time In:</th><td style="width:13%">${E(fmtT(o.time_in))}</td><th style="width:12%">Time Out:</th><td>${E(fmtT(o.time_out))}</td></tr>
  <tr><th>Observation Date:</th><td>${E(fmtD(o.date))}</td><th>Grade(s):</th><td>${E(o.grades)}</td><th>Subject/Lesson:</th><td>${E(o.subject)}</td></tr></table>`;
  secs.forEach(s => {
    if (s.n === 1) {
      h += `<table><tr><th class="l">Question</th><th class="r">Notes/Evidence</th></tr>` + s.q.map(q => { const a = answers[q.id], key = 'q_' + q.id; return `<tr><td>${E(q.text)}${(q.options || '').split('|').filter(Boolean).length ? '<div>' + q.options.split('|').map(x => `${a && a.choice === x ? '☑' : '☐'} ${E(x)}`).join(' &nbsp; ') + '</div>' : ''}</td><td>${noteTxt(key)}</td></tr>`; }).join('') + `</table>`;
    } else if (s.n === 7) {
      h += `<table><tr><th>Actionable Feedback</th></tr><tr><td>${d.glows ? `<b>Glows - what went well</b><div class="nt">${E(d.glows)}</div>` : ''}<b>Grows: ${E((s.q[0] || {}).text || 'What are some possible strategies or next steps to deepen learning?')}</b><div class="nt">${E(d.feedback || '')}</div>${(d.followups || []).length ? '<div class="mv">Follow-ups</div>' + d.followups.map(f => `<div class="it"><span class="cb">${f.status === 'done' ? '☑' : '☐'}</span><span>${E(f.text)}${f.due ? ' (due ' + E(fmtD(f.due)) + ')' : ''}</span></div>`).join('') : ''}</td></tr></table>`;
    } else {
      h += `<table><tr><th class="l">${E(s.title)}</th><th class="r">Notes/Evidence</th></tr>` +
        ['teacher', 'student'].map(role => `<tr><td><div class="mv">Evidence of ${role === 'teacher' ? 'Teacher' : 'Student'} Move Examples (Check off)</div>${s[role].map(it => item(it, role, s.n)).join('')}${orphan(s.n, role, s[role].map(i => i.id))}</td><td>${noteTxt(noteKey(s.n, role))}</td></tr>`).join('') + `</table>`;
    }
  });
  if (o.type === 'formal' && opt.prepost && (d.pre_notes || d.post_notes || o.pre_date || o.post_date)) {
    h += `<table><tr><th class="l">Pre-observation conference ${o.pre_date ? '(' + E(fmtD(o.pre_date)) + ')' : ''}</th><th class="r">Post-observation conference ${o.post_date ? '(' + E(fmtD(o.post_date)) + ')' : ''}${o.ratings_shared ? ' - ratings shared ' + E(fmtD(o.ratings_shared)) : ''}</th></tr><tr><td class="nt">${E(d.pre_notes || '')}</td><td class="nt">${E(d.post_notes || '')}</td></tr></table>`;
  }
  h += `<div class="foot">Observer: ${E(o.updated_by || o.created_by)} &middot; Confidential personnel record &middot; Printed ${E(fmtD(todayStr()))}</div></div>`;
  if (opt.transcript && r.transcript) h += `<div class="pb"></div><div class="pagefit2"><h1>Transcript - ${E(o.teacher)}, ${E(fmtD(o.date))}</h1><div class="nt" style="font:8pt/1.3 ui-monospace,Menlo,monospace;white-space:pre-wrap">${E(r.transcript)}</div></div>`;
  return h + '</div>';
}

/* ============ EMAIL FEEDBACK (nothing sends until you press Send) ============ */
async function emailModal(id) {
  let r; try { r = await api('obs_get', undefined, { id }); } catch (e) { return toast(e.message, true); }
  const o = r.obs, d = r.data, t = (S.init.teachers || []).find(x => x.name === o.teacher) || {};
  const secs = sections().filter(s => s.n >= 1 && s.n <= 6);
  const sel = { moves: true };
  const bullets = (sec, role) => Object.keys(d.checks || {}).map(k => d.checks[k]).filter(c => String(c.section) === String(sec) && c.role === role).map(c => '  - ' + c.text);
  const allMoves = role => { const out = []; Object.keys(d.checks || {}).map(k => d.checks[k]).sort((a, b) => (a.t < b.t ? -1 : 1)).forEach(c => { if (c.role === role) out.push('  - ' + c.text); }); return out; };
  const fu = (d.followups || []).filter(f => f.status !== 'done');
  const build = () => {
    const glows = $('#eglows').value.trim(), grows = $('#egrows').value.trim(), L = [];
    L.push('Hello ' + o.teacher + ',', '', 'Thank you for welcoming me into your classroom on ' + fmtD(o.date) + (o.period ? ' (' + o.period + ')' : '') + (o.subject ? ' during ' + o.subject : '') + '. Here are my glows and grows from the visit.', '');
    L.push('GLOWS - what went well', glows || '(add a glow)');
    if (sel.moves) { const tm = allMoves('teacher'), sm = allMoves('student'); if (tm.length) L.push('', 'Teacher moves I saw:', ...tm); if (sm.length) L.push('', 'Student moves I saw:', ...sm); }
    L.push('');
    secs.forEach(s => {
      if (!sel[s.n]) return; const part = [];
      s.q.forEach(q => { const a = (d.answers || {})[q.id], n = (d.notes || {})['q_' + q.id]; if ((a && a.choice) || (n && n.text)) part.push(q.text + (a && a.choice ? ' - ' + a.choice : '') + (n && n.text ? '\n  ' + n.text.trim() : '')); });
      ['teacher', 'student'].forEach(role => {
        if (!sel.moves) { const b = bullets(s.n, role); if (b.length) part.push((role === 'teacher' ? 'Teacher moves I saw:' : 'Student moves I saw:') + '\n' + b.join('\n')); }
        const n = (d.notes || {})[noteKey(s.n, role)]; if (n && n.text && n.text.trim()) part.push((role === 'teacher' ? 'Notes on teacher moves: ' : 'Notes on student moves: ') + n.text.trim());
      });
      L.push(s.title.toUpperCase()); L.push(part.length ? part.join('\n') : '(nothing recorded)'); L.push('');
    });
    if (sel.tags) { const codes = new Set(); Object.values(d.checks || {}).forEach(c => splitCodes(c.codes).forEach(x => codes.add(x))); Object.values(d.notes || {}).forEach(n => (n.tags || []).forEach(x => codes.add(x))); if (codes.size) { L.push('TLF ELEMENTS I TAGGED'); Array.from(codes).sort().forEach(c => L.push('  - ' + c + ' ' + fwName(c))); L.push(''); } }
    L.push('GROWS - next steps to deepen learning', grows || '(add a next step)');
    if (sel.fu && fu.length) { L.push('', 'Follow-up items:'); fu.forEach(f => L.push('  - ' + f.text + (f.due ? ' (by ' + fmtD(f.due) + ')' : ''))); }
    L.push('', 'Please reach out if you would like to talk any of this through.', '', S.who, (S.init.settings || {}).school_name || '');
    return L.join('\n');
  };
  sel.fu = fu.length > 0;
  const chk = (k, label, on) => `<div class="chk ${on ? 'on' : ''}" data-s="${k}" style="min-height:44px;margin:4px 0"><span class="box">${on ? '✓' : ''}</span><span class="tx">${label}</span></div>`;
  const m = modal(`<div class="hd"><h3>Email glows and grows</h3><button class="btn small alt" data-x>Close</button></div>
    <p class="small muted" style="margin:0 0 8px">The email always opens with glows and ends with grows (next steps). Edit either box, choose extras, read the preview, then press Send. Nothing is sent automatically. It sends from the Google account that owns your script.</p>
    <label class="f">Glows - what went well</label><textarea id="eglows" rows="4" placeholder="Start with the positives">${esc((d.glows || '').trim() || glowDraft(d))}</textarea>
    <label class="f" style="margin-top:8px">Grows - next steps to deepen learning</label><textarea id="egrows" rows="4" placeholder="What is one next step?">${esc(d.feedback || '')}</textarea>
    <div id="esecs" style="margin-top:6px">${chk('moves', 'List the teacher and student moves I checked (under Glows)', true)}${fu.length ? chk('fu', 'Add open follow-up items (under Grows)', true) : ''}
      <details style="margin:6px 0"><summary class="small muted" style="cursor:pointer;min-height:36px;display:flex;align-items:center">More to include between glows and grows</summary>${secs.map(s => chk(s.n, s.n + '. ' + esc(s.title) + ' (my notes)', false)).join('')}${chk('tags', 'TLF elements tagged (code and name)', false)}</details></div>
    <label class="f" style="margin-top:8px">To</label><input type="email" id="eto" value="${esc(t.email || '')}" placeholder="teacher email">
    <label class="f" style="margin-top:8px">Subject</label><input type="text" id="esub" value="Classroom visit - glows and grows (${esc(fmtD(o.date))})">
    <label class="f" style="margin-top:8px">Preview (you can edit; changing the boxes above rebuilds it)</label><textarea id="ebody" rows="14"></textarea>
    <div class="row" style="margin-top:10px"><button class="btn gold" id="esend">Send email</button><button class="btn alt" data-x2>Cancel</button></div>`);
  const draw = () => { $('#ebody').value = build(); };
  draw();
  $('#eglows').oninput = draw; $('#egrows').oninput = draw;
  $('#esecs').onclick = e => { const c = e.target.closest('[data-s]'); if (!c) return; const k = c.dataset.s; sel[k] = !sel[k]; c.classList.toggle('on', !!sel[k]); $('.box', c).textContent = sel[k] ? '✓' : ''; draw(); };
  $('[data-x]', m).onclick = closeModal; $('[data-x2]', m).onclick = closeModal;
  $('#esend').onclick = async () => {
    const to = $('#eto').value.trim(); if (!to) return toast('Type the teacher\'s email address.', true);
    if (!$('#eglows').value.trim()) return toast('Start with a glow: add at least one positive.', true);
    if (!$('#egrows').value.trim()) return toast('End with a grow: add at least one next step.', true);
    if (!(await confirmBox('Send this email to ' + to + ' now?', 'Send'))) return;
    try {
      await api('send_feedback', { obs_id: id, to, subject: $('#esub').value, body: $('#ebody').value, sections: 'glows,grows' + Object.keys(sel).filter(k => sel[k]).map(k => ',' + k).join('') });
      if (to !== t.email && t.name !== undefined) { api('teacher_save', { name: o.teacher, email: to }).then(x => S.init.teachers = x.teachers).catch(() => { }); }
      closeModal(); toast('Sent to ' + to);
    } catch (e) { toast(e.message, true); }
  };
}

/* ============ START ============ */
loadSession();
if (S.token) boot(); else showLogin();

</script>
