/* ---------- printable CDI form ---------- */

<body>
<noscript>This page needs JavaScript.</noscript>
<script>
'use strict';
/* SP Observe - page code. Contains NO teacher, student or login data: everything comes from your script after you sign in. */
const BUILD = 'build-01-observe-initial';
const API_URL = 'https://script.google.com/macros/s/AKfycbyGERxfSv0blFBxH1nL7Tj53a_ja1sdTfsULgwAt9R78bx5EmTavD6VFQueqB4PlrQ/exec';   // <- between the quotes, paste the Apps Script web app URL (ends in /exec)

/* ---------- tiny helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { } }
function lsKeys(prefix) { try { return Object.keys(localStorage).filter(k => k.indexOf(prefix) === 0); } catch (e) { return []; } }
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const hm = d => pad2(d.getHours()) + ':' + pad2(d.getMinutes());
const hms = d => hm(d) + ':' + pad2(d.getSeconds());
const isoLocal = d => ymd(d) + 'T' + hms(d);
function fmtT(t) { const m = /^(\d{1,2}):(\d{2})/.exec(t || ''); if (!m) return t || ''; let h = +m[1]; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + m[2] + ' ' + ap; }
function fmtD(s) { if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return s || ''; const d = new Date(s + 'T12:00:00'); return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); }
function fmtDs(s) { if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return s || ''; const d = new Date(s + 'T12:00:00'); return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }); }
function rid(prefix) { const a = new Uint8Array(8); (self.crypto || window.crypto).getRandomValues(a); return prefix + Array.from(a, b => (b % 36).toString(36)).join(''); }
const todayStr = () => ymd(new Date());
function daysTxt(n) { return n === 0 ? 'today' : n === 1 ? '1 day' : n < 0 ? Math.abs(n) + ' days past' : n + ' days'; }
function hhmmToMin(t) { const m = /^(\d{1,2}):(\d{2})/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null; }
function minutesBetween(a, b) { const x = hhmmToMin(a), y = hhmmToMin(b); return x == null || y == null || y < x ? null : y - x; }

/* ---------- state ---------- */
const S = { token: null, who: '', init: null, tok_exp: 0, cur: null, dash_days: null };
function saveSession() {
  if (S.token) lsSet('spobs_sess', JSON.stringify({ token: S.token, who: S.who, exp: S.tok_exp }));
  else lsDel('spobs_sess');
}
function loadSession() {
  try { const o = JSON.parse(lsGet('spobs_sess') || 'null'); if (o && o.token && o.exp > Date.now()) { S.token = o.token; S.who = o.who; S.tok_exp = o.exp; } } catch (e) { }
}
function apiBase() { return (API_URL && !/PASTE/.test(API_URL)) ? API_URL : (lsGet('spobs_api') || ''); }

/* ---------- talking to the Apps Script (GET + JSON, long data sent in pieces) ---------- */
class AuthError extends Error { }
async function rawGet(params) {
  const base = apiBase();
  if (!base) throw new Error('The web app address has not been set yet.');
  const q = Object.keys(params).filter(k => params[k] !== undefined && params[k] !== null).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k])).join('&');
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 45000);
  try {
    const r = await fetch(base + (base.indexOf('?') >= 0 ? '&' : '?') + q, { method: 'GET', redirect: 'follow', signal: ctl.signal });
    if (!r.ok) throw new Error('Server answered ' + r.status);
    return await r.json();
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('The server took too long. Check your connection and try again.');
    if (e instanceof TypeError) throw new Error('Could not reach the server (offline?).');
    throw e;
  } finally { clearTimeout(to); }
}
function splitForUrl(json, maxEnc) {
  const out = []; let i = 0;
  while (i < json.length) {
    let n = Math.min(1500, json.length - i);
    for (; ;) {
      let piece = json.substr(i, n);
      if (n > 1 && /[\uD800-\uDBFF]/.test(piece.slice(-1))) { n--; continue; }
      if (encodeURIComponent(piece).length <= maxEnc || n <= 20) { out.push(piece); i += n; break; }
      n = Math.floor(n * 0.7);
    }
  }
  return out;
}
async function api(action, payload, extra, soft) {
  const params = Object.assign({ action, token: S.token || '' }, extra || {});
  if (payload !== undefined) {
    const json = JSON.stringify(payload);
    if (encodeURIComponent(json).length < 1800) params.p = json;
    else {
      const parts = splitForUrl(json, 2400), k = rid('u');
      const res = await Promise.all(parts.map((d, i) => rawGet({ action: 'put', token: S.token || '', k, i, n: parts.length, d })));
      for (const r of res) { if (r.auth) { authLost(); throw new AuthError('Please sign in again.'); } if (!r.ok) throw new Error(r.error || 'Upload failed'); }
      params.ref = k; params.n = parts.length;
    }
  }
  const res = await rawGet(params);
  if (res.auth) { authLost(); throw new AuthError(res.error); }
  if (!res.ok && !soft) { const e = new Error(res.error || 'Something went wrong.'); e.res = res; throw e; }
  return res;
}
function authLost() { S.token = null; saveSession(); showLogin('Your session ended. Please sign in again.'); }

/* ---------- toast + modal ---------- */
let toastT;
function toast(msg, bad) {
  $$('.toast').forEach(t => t.remove());
  const d = document.createElement('div'); d.className = 'toast' + (bad ? ' bad' : ''); d.textContent = msg; d.setAttribute('role', 'status');
  document.body.appendChild(d); clearTimeout(toastT); toastT = setTimeout(() => d.remove(), bad ? 6000 : 2600);
}
function modal(html, onClose) {
  closeModal();
  const o = document.createElement('div'); o.className = 'ovl'; o.id = 'modal';
  o.innerHTML = '<div class="sheetm" role="dialog" aria-modal="true">' + html + '</div>';
  o.addEventListener('click', e => { if (e.target === o) closeModal(); });
  document.body.appendChild(o); o._onClose = onClose; return o;
}
function closeModal() { const o = $('#modal'); if (o) { const f = o._onClose; o.remove(); if (f) f(); } }
function confirmBox(text, yes, danger) {      // its own layer, so it never closes the window underneath it
  return new Promise(res => {
    const o = document.createElement('div'); o.className = 'ovl'; o.id = 'cbox'; o.style.zIndex = 70;
    o.innerHTML = '<div class="sheetm" role="alertdialog" aria-modal="true"><h3>' + esc(text) + '</h3><div class="row" style="margin-top:14px"><button class="btn ' + (danger ? 'bad' : '') + '" data-y>' + esc(yes || 'Yes') + '</button><button class="btn alt" data-n>Cancel</button></div></div>';
    document.body.appendChild(o);
    const done = v => { o.remove(); res(v); };
    $('[data-y]', o).onclick = () => done(true); $('[data-n]', o).onclick = () => done(false);
    o.addEventListener('click', e => { if (e.target === o) done(false); });
  });
}

/* ---------- shell ---------- */
function shell() {
  document.body.innerHTML = `
  <header class="top">
    <div class="brand"><img src="logo.png" alt="" id="logoimg" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'mark',textContent:'SP'}))"><small>${esc(BUILD)}</small></div>
    <div class="title"><b>SP Observe</b><span id="sub">Private classroom observations</span></div>
    <div class="who" id="who"></div>
  </header>
  <nav class="tabs" id="tabs">
    <a href="#/" data-t="home">Home</a><a href="#/new" data-t="new">Observe</a><a href="#/visits" data-t="visits">Visits</a>
    <a href="#/teachers" data-t="teachers">Teachers</a><a href="#/reports" data-t="reports">Reports</a><a href="#/settings" data-t="settings">Settings</a>
  </nav>
  <main id="view"></main>`;
  $('#who').textContent = S.who;
  $('#sub').textContent = (S.init && S.init.settings.school_name) || 'Private classroom observations';
}
function setTab(t) { $$('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.t === t)); }
function view(html) { $('#view').innerHTML = html; window.scrollTo(0, 0); }
function bar(html) { let b = $('#actbar'); if (!b) { b = document.createElement('div'); b.id = 'actbar'; b.className = 'bar'; document.body.appendChild(b); } b.innerHTML = html; }
function clearBar() { const b = $('#actbar'); if (b) b.remove(); }

/* ---------- login ---------- */
function showLogin(msg) {
  clearBar(); stopClock(); stopAutosave();
  const base = apiBase();
  document.body.innerHTML = `
  <div class="login">
    <div style="text-align:center;margin-bottom:14px"><img src="logo.png" alt="" style="height:70px" onerror="this.style.display='none'"><h1 style="margin-top:8px">SP Observe</h1><div class="muted small">${esc(BUILD)}</div></div>
    <div class="card">
      <label class="f" for="code">Private code</label>
      <input id="code" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
      ${base ? '' : `<label class="f" for="api" style="margin-top:10px">Web app address (one time)</label><input id="api" type="text" placeholder="https://script.google.com/macros/s/.../exec" autocapitalize="off">`}
      <div id="lmsg" class="small" style="color:var(--bad);min-height:20px;margin:8px 0">${esc(msg || '')}</div>
      <button class="btn big" id="go">Sign in</button>
    </div>
    <p class="muted small" style="text-align:center">Personnel notes. Authorized administrators only.</p>
  </div>`;
  const go = async () => {
    const a = $('#api'); if (a && a.value.trim()) lsSet('spobs_api', a.value.trim());
    const btn = $('#go'); btn.disabled = true; $('#lmsg').textContent = 'Signing in...';
    try {
      const r = await rawGet({ action: 'login', code: $('#code').value });
      if (!r.ok) { $('#lmsg').textContent = r.error || 'Sign in failed.'; btn.disabled = false; return; }
      S.token = r.token; S.who = r.who; S.tok_exp = Date.now() + r.hours * 3600000; saveSession();
      await boot();
    } catch (e) { $('#lmsg').textContent = e.message; btn.disabled = false; }
  };
  $('#go').onclick = go; $('#code').addEventListener('keydown', e => { if (e.key === 'Enter') go(); }); $('#code').focus();
}

async function boot() {
  try {
    document.body.innerHTML = '<div class="login"><div class="card" style="text-align:center">Loading...</div></div>';
    S.init = await api('init');
    S.who = S.init.who; shell(); route();
  } catch (e) { if (!(e instanceof AuthError)) showLogin(e.message); }
}

/* ---------- router ---------- */
function go(path) { if (location.hash === '#' + path) route(); else location.hash = path; }
window.addEventListener('hashchange', () => { if (S.init) route(); });
async function route() {
  if (!S.init) return;
  const h = (location.hash || '#/').slice(1), parts = h.split('?')[0].split('/').filter(Boolean);
  const q = new URLSearchParams(h.split('?')[1] || '');
  if (!(parts[0] === 'obs')) { stopClock(); stopAutosave(); stopSTT(); }
  if (parts[0] !== 'obs') clearBar();
  try {
    switch (parts[0] || 'home') {
      case 'home': setTab('home'); return await viewHome();
      case 'new': setTab('new'); return viewNew(q);
      case 'obs': setTab('new'); return await viewObs(decodeURIComponent(parts[1] || ''));
      case 'done': setTab('visits'); return viewDone(decodeURIComponent(parts[1] || ''));
      case 'visits': setTab('visits'); return await viewVisits();
      case 'teachers': setTab('teachers'); return viewTeachers();
      case 'teacher': setTab('teachers'); return await viewTeacher(decodeURIComponent(parts[1] || ''));
      case 'reports': setTab('reports'); return await viewReports(q);
      case 'settings': setTab('settings'); return await viewSettings();
      case 'print': setTab('visits'); return await viewPrint(decodeURIComponent(parts[1] || ''));
      default: go('/');
    }
  } catch (e) { if (!(e instanceof AuthError)) { view('<div class="card bad"><b>Something went wrong.</b><br>' + esc(e.message) + '</div>'); } }
}

/* ---------- HOME / dashboard ---------- */
function statusPill(ed) {
  const f = ed.formal, P = (c, t) => `<span class="pill ${c}">${esc(t)}</span>`;
  if (f === 'not_started') return P('', 'Formal: not started');
  if (f === 'in_progress') return P('info', 'Formal: in progress');
  if (f === 'observed') return ed.post_overdue ? P('bad', 'Post-conference overdue (was due ' + fmtD(ed.post_due) + ')') : P('warn', 'Post-conference due ' + fmtD(ed.post_due));
  if (f === 'post_done') return ed.ratings_overdue ? P('bad', 'Share ratings now (due ' + fmtD(ed.ratings_due) + ')') : P('warn', 'Share ratings by ' + fmtD(ed.ratings_due));
  return P('ok', 'Formal complete');
}

/* ---------- CSV ---------- */
function csvCell(v) {
  v = v == null ? '' : String(v);
  if (/^[=+\-@\t\r]/.test(v)) v = "'" + v;           // keep spreadsheet programs from running text as formulas
  return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function toCsv(rows, cols) { return [cols.join(',')].concat(rows.map(r => cols.map(c => csvCell(r[c])).join(','))).join('\r\n'); }
function download(name, text, type) {
  const b = new Blob([text], { type: type || 'text/csv;charset=utf-8' }), a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
async function exportCsv(from, to) {
  const r = await api('export', { from: from || undefined, to: to || undefined });
  const stamp = todayStr();
  download('observations-' + stamp + '.csv', toCsv(r.observations, ['id', 'type', 'teacher', 'date', 'time_in', 'time_out', 'minutes', 'period', 'room', 'grades', 'subject', 'is_gpv', 'status', 'pre_date', 'post_date', 'ratings_shared', 'n_checks', 'n_notes', 'created_by', 'updated_by', 'updated_at']));
  setTimeout(() => download('evidence-' + stamp + '.csv', toCsv(r.evidence, ['obs_id', 'teacher', 'date', 'section', 'role', 'kind', 'text', 'codes', 'extra_tags', 'time'])), 400);
  toast('Two files downloaded: observations and evidence');
}

/* ============ THE OBSERVATION FORM ============ */
let O = null;                      // observation being edited
let clockT = null, autoT = null, localT = null, saving = false;
const FW = () => { if (!S._fw) { S._fw = {}; (S.init.framework || []).forEach(f => S._fw[f.code] = f); } return S._fw; };
function fwName(c) { const f = FW()[c]; return f ? f.element : ''; }
function normCode(c) { return String(c || '').trim().toLowerCase().replace(/^([1-5][a-e])\.?([1-9])$/, '$1.$2'); }
function splitCodes(s) { return String(s || '').split(/[,&;\s]+/).map(normCode).filter(Boolean); }
function periodFor(t) {
  const m = hhmmToMin(t); if (m == null) return '';
  const b = (S.init.bell || []).find(x => { const a = hhmmToMin(x.start), z = hhmmToMin(x.end); return a != null && z != null && m >= a && m < z; });
  return b ? b.name : '';
}
function sections() {
  const map = {};
  (S.init.form || []).forEach(r => {
    const s = map[r.section] || (map[r.section] = { n: r.section, title: '', informal: 'Y', q: [], teacher: [], student: [] });
    if (r.type === 'section') { s.title = r.text; s.informal = r.informal === 'N' ? 'N' : 'Y'; }
    else if (r.type === 'question') s.q.push(r); else if (r.type === 'teacher') s.teacher.push(r); else if (r.type === 'student') s.student.push(r);
  });
  return Object.keys(map).map(Number).sort((a, b) => a - b).map(k => map[k]);
}
function blankData() { return { answers: {}, checks: {}, notes: {}, feedback: '', pre_notes: '', post_notes: '', followups: [] }; }
function addWeekdays(s, n) { const d = new Date(s + 'T12:00:00'); let left = n; while (left > 0) { d.setDate(d.getDate() + 1); const w = d.getDay(); if (w !== 0 && w !== 6) left--; } return ymd(d); }

async function newObs(type, teacher, gpv) {
  const now = new Date(), t = (S.init.teachers || []).find(x => x.name === teacher) || {};
  O = { id: rid('o_'), type, teacher, date: ymd(now), time_in: hm(now), time_out: '', period: periodFor(hm(now)), room: t.default_room || '', grades: t.grades || '', subject: '',
    is_gpv: !!gpv, status: 'draft', pre_date: '', post_date: '', ratings_shared: '', consent_transcript: false, data: blankData(), transcript: '', base_updated: '', _trSaved: '', _dirty: true, _started: now.getTime(), _new: true };
  saveLocal(); go('/obs/' + encodeURIComponent(O.id));
  if (!t.default_room) {          // fill the room from the last visit, if there was one
    api('obs_list', { teacher }, undefined, true).then(r => { const last = (r.observations || []).find(o => o.room); if (last && O && O.teacher === teacher && !O.room) { O.room = last.room; const el = $('[data-f=room]'); if (el) el.value = O.room; touch(); } }).catch(() => { });
  }
}
function saveLocal() {
  if (!O) return;
  const copy = Object.assign({}, O); lsSet('spobs_draft_' + O.id, JSON.stringify({ O: copy, saved: Date.now() }));
}
function touch() {
  if (!O) return; O._dirty = true; clearTimeout(localT); localT = setTimeout(() => { saveLocal(); setSt('Draft kept on this device'); }, 350);
}
function setSt(t) { const e = $('#svst'); if (e) e.textContent = t; }
function stopClock() { clearInterval(clockT); clockT = null; }
function stopAutosave() { clearInterval(autoT); autoT = null; }
function startClock() {
  stopClock();
  const tick = () => {
    const e = $('#clk'); if (!e || !O) return;
    if (O.time_out || O.status === 'final') { e.textContent = 'In ' + fmtT(O.time_in) + (O.time_out ? ' - Out ' + fmtT(O.time_out) : ''); return; }
    let start = O._started; if (!start) { const m = hhmmToMin(O.time_in); const d = new Date(O.date + 'T00:00:00'); start = d.getTime() + (m || 0) * 60000; }
    const s = Math.max(0, Math.floor((Date.now() - start) / 1000));
    e.textContent = 'In ' + fmtT(O.time_in) + '  ·  ' + pad2(Math.floor(s / 3600)) + ':' + pad2(Math.floor(s / 60) % 60) + ':' + pad2(s % 60);
  };
  tick(); clockT = setInterval(tick, 1000);
}
document.addEventListener('visibilitychange', () => { if (document.hidden && O) { clearTimeout(localT); saveLocal(); } });
window.addEventListener('pagehide', () => { if (O) saveLocal(); });

async function viewObs(id) {
  if (!O || O.id !== id) {
    stopSTT(); O = null;
    const loc = lsGet('spobs_draft_' + id);
    if (loc) { try { O = JSON.parse(loc).O; } catch (e) { O = null; } }
    if (!O) {
      view('<div class="card muted">Loading...</div>');
      const r = await api('obs_get', undefined, { id });
      const d = Object.assign(blankData(), r.data || {});
      O = Object.assign({}, r.obs, { is_gpv: !!r.obs.is_gpv, consent_transcript: !!r.obs.consent_transcript, data: d, transcript: r.transcript || '', base_updated: r.obs.updated_at, _trSaved: r.transcript || '', _dirty: false });
    } else if (!O.data) O.data = blankData();
  }
  renderForm();
}

function headerCard() {

  </div></div>`;
}
function codeChips(codes) { return splitCodes(codes).map(c => `<span class="code" title="${esc(fwName(c))}">${esc(c)}</span>`).join(''); }
function checkHtml(it, sec, role) {
  const c = O.data.checks[it.id];
  return `<div class="chk ${c ? 'on' : ''}" role="checkbox" aria-checked="${c ? 'true' : 'false'}" tabindex="0" data-check="${esc(it.id)}" data-sec="${sec}" data-role="${role}"><span class="box">${c ? '✓' : ''}</span><span class="tx">${esc(it.text)} ${codeChips(it.codes)}<span class="when">${c ? esc(fmtT(c.t.slice(11, 16))) : ''}</span></span></div>`;
}
function orphanChecks(sec, role, known) {
  return Object.keys(O.data.checks).filter(id => { const c = O.data.checks[id]; return String(c.section) === String(sec) && c.role === role && known.indexOf(id) < 0; })
    .map(id => { const c = O.data.checks[id]; return checkHtml({ id, text: c.text + ' (no longer on the form)', codes: c.codes }, sec, role); }).join('');
}
function noteKey(sec, role) { return 's' + sec + '_' + role; }
function noteBlock(key, label) {
  const n = O.data.notes[key] || {};
  return `<div class="notelbl">${esc(label || 'Notes/Evidence')}</div><textarea data-note="${esc(key)}" rows="3" placeholder="Notes/Evidence">${esc(n.text || '')}</textarea>
  <div class="tags" id="tags_${esc(key)}">${tagsHtml(key)}</div><button class="btn small alt" data-tagadd="${esc(key)}">+ Add TLF tag</button>`;
}
function groupCodes(key) {          // codes carried by checked items in this note's group (sections 2-6)
  const m = /^s(\d+)_(teacher|student)$/.exec(key); if (!m) return [];
  const out = [];
  Object.keys(O.data.checks).forEach(id => { const c = O.data.checks[id]; if (String(c.section) === m[1] && c.role === m[2]) splitCodes(c.codes).forEach(x => { if (out.indexOf(x) < 0) out.push(x); }); });
  return out;
}
function tagsHtml(key) {
  const n = O.data.notes[key] || {}, ex = (n.tags || []);
  const auto = groupCodes(key).filter(c => ex.indexOf(c) < 0);
  return ex.map(c => `<span class="tag" title="${esc(fwName(c))}">${esc(c)} <button data-tagrm="${esc(key)}|${esc(c)}" aria-label="Remove tag ${esc(c)}">×</button></span>`).join('') +
    auto.map(c => `<span class="code" title="Added automatically from checked items: ${esc(fwName(c))}">${esc(c)}</span>`).join('');
}
function sectionBadgeCount(s) {
  let n = 0; const sec = String(s.n);
  Object.values(O.data.checks).forEach(c => { if (String(c.section) === sec) n++; });
  Object.values(O.data.answers).forEach(a => { if (String(a.section) === sec && a.choice) n++; });
  Object.keys(O.data.notes).forEach(k => { const x = O.data.notes[k]; if (String(x.section) === sec && (x.text || '').trim()) n++; });
  if (s.n === 7) { if ((O.data.feedback || '').trim()) n++; n += (O.data.followups || []).filter(f => f.text.trim()).length; }
  return n;
}
function sectionHtml(s) {
  let body = '';
  if (s.n === 7) {
    const q = s.q[0];
    body = `<div class="sub">${esc(q ? q.text : 'What are some possible strategies or next steps to deepen learning?')}</div><textarea data-feedback rows="4" placeholder="Notes">${esc(O.data.feedback || '')}</textarea>
    <div class="sub">Follow-up items (optional)</div><div id="fulist">${fuListHtml()}</div><button class="btn small alt" data-fuadd>+ Add follow-up</button>`;
  } else {
    s.q.forEach(q => {
      const a = O.data.answers[q.id] || {}, key = 'q_' + q.id, opts = (q.options || '').split('|').filter(Boolean);
      body += `<div class="sub">${esc(q.text)}</div>`;
      if (opts.length) body += `<div class="opts" data-q="${esc(q.id)}">${opts.map(o => `<button data-opt="${esc(o)}" class="${a.choice === o ? 'on' : ''}">${esc(o)}</button>`).join('')}</div>`;
      body += noteBlock(key, 'Notes/Evidence');
    });
    ['teacher', 'student'].forEach(role => {
      const items = s[role]; if (!items.length && !Object.values(O.data.checks).some(c => String(c.section) === String(s.n) && c.role === role)) return;
      body += `<div class="sub">Evidence of ${role === 'teacher' ? 'Teacher' : 'Student'} Move Examples (Check off)</div>` + items.map(it => checkHtml(it, s.n, role)).join('') + orphanChecks(s.n, role, items.map(i => i.id)) + noteBlock(noteKey(s.n, role));
    });
  }
  return `<details class="sec" data-sec="${s.n}" ${(s.n === 1 || s.n === 7) ? 'open' : ''}><summary><span class="num">${s.n}</span><span>${esc(s.title)}</span><span class="pill info" data-badge="${s.n}" style="margin-left:auto;margin-right:8px">${sectionBadgeCount(s)}</span></summary><div class="body">${body}</div></details>`;
}
function fuListHtml() {
  return (O.data.followups || []).map((f, i) => `<div class="row" style="flex-wrap:nowrap;margin:6px 0"><input type="text" data-fu="${i}" data-k="text" value="${esc(f.text)}" placeholder="What will happen next?" style="flex:2"><input type="date" data-fu="${i}" data-k="due" value="${esc(f.due || '')}" style="flex:1;min-width:130px"><button class="btn small alt" data-furm="${i}" aria-label="Remove follow-up">✕</button></div>`).join('');
}
function preCard() {
  return `<div class="card"><h3>Pre-observation conference</h3><p class="small muted" style="margin:4px 0">Held 1-3 days before the observation.</p>
  <label class="f">Conference date</label><input type="date" data-f="pre_date" value="${esc(O.pre_date)}">
  <label class="f" style="margin-top:8px">Notes</label><textarea data-g="pre_notes" rows="4">${esc(O.data.pre_notes || '')}</textarea></div>`;
}
function postCard() {

function payload(extra) {

async function saveObs(opt) {
  opt = opt || {};

  if (!O.teacher) { if (!opt.auto) toast('Choose a teacher first.', true); return false; }
  if (opt.finish) {
    if (!O.time_out) { O.time_out = hm(new Date()); const e = $('[data-f=time_out]'); if (e) e.value = O.time_out; }
    const mins = minutesBetween(O.time_in, O.time_out);
    if (O.is_gpv && mins != null && mins < 10 && !(await confirmBox('Only ' + mins + ' minute(s) between Time In and Time Out. A Growth Plan Visit is at least 10 minutes. Finish anyway?', 'Finish anyway'))) return false;
    O.status = 'final';
  }
  saving = true; if (!opt.auto) setSt('Saving...');
  try {
    const r = await api('obs_save', payload({ auto: !!opt.auto, force: !!O._force }), undefined, true);
    if (!r.ok) {
      if (r.conflict) { if (opt.finish) O.status = 'draft'; saving = false; conflictModal(r.error); return false; }
      throw new Error(r.error);
    }
    O._force = false; O.base_updated = r.updated_at; O._dirty = false; O._new = false;
    if ((O.transcript || '') !== (O._trSaved || '')) { await api('tr_save', { id: O.id, text: O.transcript || '' }); O._trSaved = O.transcript || ''; }
    if (r.warnings && r.warnings.length && !opt.auto) toast('Saved. Note: ' + r.warnings[0], true);
    if (O.status === 'final') lsDel('spobs_draft_' + O.id); else saveLocal();
    setSt(opt.auto ? 'Auto-saved ' + fmtT(hm(new Date())) : 'Saved ' + fmtT(hm(new Date())));
    saving = false;
    if (opt.finish) { const id = O.id; O = null; go('/done/' + encodeURIComponent(id)); }
    else if (!opt.auto && !opt.quiet) toast(O.status === 'final' ? 'Changes saved' : 'Draft saved');
    return true;
  } catch (e) {
    saving = false; if (opt.finish) O.status = 'draft';
    if (e instanceof AuthError) { saveLocal(); return false; }
    setSt('Not saved to server - kept on this device'); saveLocal();
    if (!opt.auto) toast(e.message, true);
    return false;
  }
}
function conflictModal(msg) {
  const m = modal(`<h3>Changed somewhere else</h3><p>${esc(msg)}</p><p class="small muted">Overwrite replaces the saved copy with what is on this screen (the old one stays in the change log). Reload shows the saved copy and drops your edits here.</p><div class="row"><button class="btn bad" data-o>Overwrite</button><button class="btn alt" data-r>Reload saved copy</button></div>`);

  $('[data-r]', m).onclick = () => { lsDel('spobs_draft_' + O.id); O = null; closeModal(); route(); };
}

}

/* ---- transcription ---- */
const STT = { rec: null, on: false };
function stopSTT() { STT.on = false; try { STT.rec && STT.rec.stop(); } catch (e) { } STT.rec = null; const b = $('#sttbtn'); if (b) b.textContent = 'Start listening'; }
function appendTranscript(text) {
  if (!text) return; const sp = $('#spk') ? $('#spk').value : '';
  O.transcript = (O.transcript || '') + (O.transcript && !/\n$/.test(O.transcript) ? '\n' : '') + '[' + hms(new Date()) + '] ' + (sp ? sp + ': ' : '') + text + '\n';
  const ta = $('#tscript'); if (ta) { ta.value = O.transcript; ta.scrollTop = ta.scrollHeight; } countTr(); touch();
}
function countTr() { const c = $('#trcount'); if (c) c.textContent = (O.transcript || '').split(/\s+/).filter(Boolean).length + ' words'; }
function bindTranscript() {
  const card = $('#trcard'); if (!card) return;
  countTr();
  $$('#trseg button').forEach(b => b.onclick = () => { $$('#trseg button').forEach(x => x.classList.toggle('on', x === b)); $$('[data-pane]', card).forEach(p => p.classList.toggle('hide', p.dataset.pane !== b.dataset.m)); });
  $('#tscript').oninput = e => { O.transcript = e.target.value; countTr(); touch(); };
  $('#trstamp').onclick = () => { const ta = $('#tscript'); O.transcript = (O.transcript || '') + (O.transcript && !/\n$/.test(O.transcript) ? '\n' : '') + '[' + hms(new Date()) + '] '; ta.value = O.transcript; ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); touch(); };
  $('#trdl').onclick = () => download('transcript-' + (O.teacher || 'obs').replace(/[^a-z0-9]+/gi, '-') + '-' + O.date + '.txt', O.transcript || '', 'text/plain;charset=utf-8');
  $('#trclr').onclick = async () => { if (O.transcript && await confirmBox('Clear the whole transcript on this screen?', 'Clear', true)) { O.transcript = ''; $('#tscript').value = ''; countTr(); touch(); } };
  $('#trfile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return; let txt = await f.text();
    if (/\.(vtt|srt)$/i.test(f.name)) txt = txt.replace(/^WEBVTT.*$/m, '').replace(/^\d+\s*$/gm, '').replace(/(\d\d:\d\d:\d\d)[.,]\d+ --> .*$/gm, '[$1]').replace(/(\[\d\d:\d\d:\d\d\])\n/g, '$1 ').replace(/\n{3,}/g, '\n\n').trim() + '\n';
    O.transcript = (O.transcript ? O.transcript + '\n' : '') + txt; $('#tscript').value = O.transcript; countTr(); touch(); toast('Loaded ' + f.name);
  };
  const btn = $('#sttbtn'); if (!btn) return;
  btn.onclick = () => {
    if (STT.on) { stopSTT(); return; }
    if (!O.consent_transcript) return toast('Check the consent box first.', true);
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition; const rec = new SR();
    rec.lang = 'en-US'; rec.continuous = true; rec.interimResults = true; STT.rec = rec; STT.on = true; btn.textContent = 'Stop listening';
    rec.onresult = ev => { let interim = ''; for (let i = ev.resultIndex; i < ev.results.length; i++) { const r = ev.results[i]; if (r.isFinal) appendTranscript(r[0].transcript.trim()); else interim += r[0].transcript; } const it = $('#interim'); if (it) it.innerHTML = interim ? '<span class="live"></span>' + esc(interim) : '<span class="live"></span>Listening...'; };
    rec.onerror = ev => { if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') { toast('Microphone permission was blocked.', true); stopSTT(); } else if (ev.error !== 'no-speech' && ev.error !== 'aborted') toast('Speech error: ' + ev.error, true); };
    rec.onend = () => { if (STT.on) { try { rec.start(); } catch (e) { setTimeout(() => { try { STT.on && rec.start(); } catch (x) { } }, 400); } } else { const it = $('#interim'); if (it) it.textContent = ''; } };
    try { rec.start(); const it = $('#interim'); if (it) it.innerHTML = '<span class="live"></span>Listening...'; } catch (e) { toast(e.message, true); stopSTT(); }
  };
}

  const secs = sections(), E = esc;
  const noteTxt = key => { const n = notes[key]; if (!n) return ''; const tags = (n.tags || []).length ? `<div class="tg">TLF: ${E(n.tags.join(', '))}</div>` : ''; return (n.text ? `<div class="nt">${E(n.text)}</div>` : '') + tags; };
  const item = (it, role, sec) => { const c = checks[it.id]; return `<div class="it ${c ? 'on' : ''}"><span class="cb">${c ? '☑' : '☐'}</span><span>${E(it.text)} <span class="cd">(${E(splitCodes(it.codes).join(' & '))})</span>${c ? ` <span class="cd">${E(fmtT(c.t.slice(11, 16)))}</span>` : ''}</span></div>`; };
  const orphan = (sec, role, known) => Object.keys(checks).filter(id => String(checks[id].section) === String(sec) && checks[id].role === role && known.indexOf(id) < 0).map(id => item({ id, text: checks[id].text, codes: checks[id].codes }, role, sec)).join('');
  let h = `<div class="sheet"><div class="pagefit">
  <h1>Classroom Observation</h1><div class="sub2">${E((S.init.settings || {}).school_name || '')} &middot; ${o.type === 'formal' ? 'Formal observation' : 'Informal walkthrough'}${o.is_gpv ? ' (Growth Plan Visit)' : ''}${o.period ? ' &middot; ' + E(o.period) : ''}${o.room ? ' &middot; ' + E(o.room) : ''}</div>
  <table><tr><th style="width:12%">Teacher:</th><td style="width:38%">${E(o.teacher)}</td><th style="width:12%">Time In:</th><td style="width:13%">${E(fmtT(o.time_in))}</td><th style="width:12%">Time Out:</th><td>${E(fmtT(o.time_out))}</td></tr>
  <tr><th>Observation Date:</th><td>${E(fmtD(o.date))}</td><th>Grade(s):</th><td>${E(o.grades)}</td><th>Subject/Lesson:</th><td>${E(o.subject)}</td></tr></table>`;
  secs.forEach(s => {
    if (s.n === 1) {
      h += `<table><tr><th class="l">Question</th><th class="r">Notes/Evidence</th></tr>` + s.q.map(q => { const a = answers[q.id], key = 'q_' + q.id; return `<tr><td>${E(q.text)}${(q.options || '').split('|').filter(Boolean).length ? '<div>' + q.options.split('|').map(x => `${a && a.choice === x ? '☑' : '☐'} ${E(x)}`).join(' &nbsp; ') + '</div>' : ''}</td><td>${noteTxt(key)}</td></tr>`; }).join('') + `</table>`;
    } else if (s.n === 7) {
      h += `<table><tr><th>Actionable Feedback</th></tr><tr><td><b>${E((s.q[0] || {}).text || 'What are some possible strategies or next steps to deepen learning?')}</b><div class="nt">${E(d.feedback || '')}</div>${(d.followups || []).length ? '<div class="mv">Follow-ups</div>' + d.followups.map(f => `<div class="it"><span class="cb">${f.status === 'done' ? '☑' : '☐'}</span><span>${E(f.text)}${f.due ? ' (due ' + E(fmtD(f.due)) + ')' : ''}</span></div>`).join('') : ''}</td></tr></table>`;
    } else {
      h += `<table><tr><th class="l">${E(s.title)}</th><th class="r">Notes/Evidence</th></tr>` +
        ['teacher', 'student'].map(role => `<tr><td><div class="mv">Evidence of ${role === 'teacher' ? 'Teacher' : 'Student'} Move Examples (Check off)</div>${s[role].map(it => item(it, role, s.n)).join('')}${orphan(s.n, role, s[role].map(i => i.id))}</td><td>${noteTxt(noteKey(s.n, role))}</td></tr>`).join('') + `</table>`;
    }
  });
  if (o.type === 'formal' && opt.prepost && (d.pre_notes || d.post_notes || o.pre_date || o.post_date)) {
    h += `<table><tr><th class="l">Pre-observation conference ${o.pre_date ? '(' + E(fmtD(o.pre_date)) + ')' : ''}</th><th class="r">Post-observation conference ${o.post_date ? '(' + E(fmtD(o.post_date)) + ')' : ''}${o.ratings_shared ? ' - ratings shared ' + E(fmtD(o.ratings_shared)) : ''}</th></tr><tr><td class="nt">${E(d.pre_notes || '')}</td><td class="nt">${E(d.post_notes || '')}</td></tr></table>`;
  }
  h += `<div class="foot">Observer: ${E(o.updated_by || o.created_by)} &middot; Confidential personnel record &middot; Printed ${E(fmtD(todayStr()))}</div></div>`;
  if (opt.transcript && r.transcript) h += `<div class="pb"></div><div class="pagefit2"><h1>Transcript - ${E(o.teacher)}, ${E(fmtD(o.date))}</h1><div class="nt" style="font:8pt/1.3 ui-monospace,Menlo,monospace;white-space:pre-wrap">${E(r.transcript)}</div></div>`;
  return h + '</div>';
}

/* ============ EMAIL FEEDBACK (nothing sends until you press Send) ============ */
async function emailModal(id) {
  let r; try { r = await api('obs_get', undefined, { id }); } catch (e) { return toast(e.message, true); }
  const o = r.obs, d = r.data, t = (S.init.teachers || []).find(x => x.name === o.teacher) || {};
  const secs = sections().filter(s => s.n !== 1 || true);
  const sel = { 7: true, fu: true };
  const bullets = (sec, role) => Object.keys(d.checks || {}).map(k => d.checks[k]).filter(c => String(c.section) === String(sec) && c.role === role).map(c => '  - ' + c.text);
  const build = () => {
    const L = [];
    L.push('Hello ' + o.teacher + ',', '', 'Thank you for welcoming me into your classroom on ' + fmtD(o.date) + (o.period ? ' (' + o.period + ')' : '') + (o.subject ? ' during ' + o.subject : '') + '. Here are my notes from the visit.', '');
    secs.forEach(s => {
      if (!sel[s.n]) return;
      if (s.n === 7) { L.push('NEXT STEPS TO DEEPEN LEARNING'); if ((d.feedback || '').trim()) L.push(d.feedback.trim()); else L.push('(none recorded)'); L.push(''); return; }
      const part = [];
      s.q.forEach(q => { const a = (d.answers || {})[q.id], n = (d.notes || {})['q_' + q.id]; if ((a && a.choice) || (n && n.text)) part.push(q.text + (a && a.choice ? ' - ' + a.choice : '') + (n && n.text ? '\n  ' + n.text.trim() : '')); });
      ['teacher', 'student'].forEach(role => {
        const b = bullets(s.n, role), n = (d.notes || {})[noteKey(s.n, role)];
        if (b.length) part.push((role === 'teacher' ? 'Teacher moves I saw:' : 'Student moves I saw:') + '\n' + b.join('\n'));
        if (n && n.text && n.text.trim()) part.push((role === 'teacher' ? 'Notes on teacher moves: ' : 'Notes on student moves: ') + n.text.trim());
      });
      L.push(s.title.toUpperCase()); L.push(part.length ? part.join('\n') : '(nothing recorded)'); L.push('');
    });
    if (sel.fu && (d.followups || []).length) { L.push('FOLLOW-UP ITEMS'); d.followups.forEach(f => L.push('  - ' + f.text + (f.due ? ' (by ' + fmtD(f.due) + ')' : ''))); L.push(''); }
    if (sel.tags) { const codes = new Set(); Object.values(d.checks || {}).forEach(c => splitCodes(c.codes).forEach(x => codes.add(x))); Object.values(d.notes || {}).forEach(n => (n.tags || []).forEach(x => codes.add(x))); if (codes.size) { L.push('TLF ELEMENTS I TAGGED'); Array.from(codes).sort().forEach(c => L.push('  - ' + c + ' ' + fwName(c))); L.push(''); } }
    L.push('Please reach out if you would like to talk any of this through.', '', S.who, (S.init.settings || {}).school_name || '');
    return L.join('\n');
  };
  const m = modal(`<div class="hd"><h3>Email feedback</h3><button class="btn small alt" data-x>Close</button></div>
    <p class="small muted" style="margin:0 0 8px">Choose what to include, read the preview, edit it if you like, then press Send. It sends from the Google account that owns your script. Nothing is sent automatically.</p>
    <div id="esecs">${secs.map(s => `<div class="chk ${sel[s.n] ? 'on' : ''}" data-s="${s.n}" style="min-height:44px;margin:4px 0"><span class="box">${sel[s.n] ? '✓' : ''}</span><span class="tx">${s.n}. ${esc(s.title)}</span></div>`).join('')}
      <div class="chk on" data-s="fu" style="min-height:44px;margin:4px 0"><span class="box">✓</span><span class="tx">Follow-up items</span></div><div class="chk" data-s="tags" style="min-height:44px;margin:4px 0"><span class="box"></span><span class="tx">TLF elements tagged (code and name)</span></div></div>
    <label class="f" style="margin-top:8px">To</label><input type="email" id="eto" value="${esc(t.email || '')}" placeholder="teacher email">
    <label class="f" style="margin-top:8px">Subject</label><input type="text" id="esub" value="Classroom visit notes - ${esc(fmtD(o.date))}">
    <label class="f" style="margin-top:8px">Preview (you can edit)</label><textarea id="ebody" rows="14"></textarea>
    <div class="row" style="margin-top:10px"><button class="btn gold" id="esend">Send email</button><button class="btn alt" data-x2>Cancel</button></div>`);
  const draw = () => { $('#ebody').value = build(); };
  draw();
  $('#esecs').onclick = e => { const c = e.target.closest('[data-s]'); if (!c) return; const k = c.dataset.s; sel[k] = !sel[k]; c.classList.toggle('on', !!sel[k]); $('.box', c).textContent = sel[k] ? '✓' : ''; draw(); };
  $('[data-x]', m).onclick = closeModal; $('[data-x2]', m).onclick = closeModal;
  $('#esend').onclick = async () => {
    const to = $('#eto').value.trim(); if (!to) return toast('Type the teacher\'s email address.', true);
    if (!(await confirmBox('Send this email to ' + to + ' now?', 'Send'))) return;
    try {
      await api('send_feedback', { obs_id: id, to, subject: $('#esub').value, body: $('#ebody').value, sections: Object.keys(sel).filter(k => sel[k]).join(',') });
      if (to !== t.email && t.name) { api('teacher_save', { name: o.teacher, email: to }).then(x => S.init.teachers = x.teachers).catch(() => { }); }
      closeModal(); toast('Sent to ' + to);
    } catch (e) { toast(e.message, true); }
  };
}

/* ============ START ============ */
loadSession();
if (S.token) boot(); else showLogin();

</script>
